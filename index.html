<html lang="uz">
<head>

<title>UstaTop</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #111827;
    padding-bottom: 75px;
}

button {
    border: none;
    cursor: pointer;
    font-family: inherit;
}

.hidden {
    display: none !important;
}

/* TOPBAR */

.topbar {
    background: white;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #eee;
    position: sticky;
    top: 0;
    z-index: 20;
}

.topbar h2 {
    font-size: 20px;
}

.back-btn {
    background: #f0f1f3;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    font-size: 22px;
}

/* HEADER */

.header {
    background: linear-gradient(
        135deg,
        #6d28d9,
        #8b5cf6
    );

    color: white;
    padding: 25px 18px 30px;
    border-radius: 0 0 25px 25px;
}

.header h1 {
    font-size: 28px;
    margin-bottom: 7px;
}

.header p {
    opacity: .9;
    font-size: 14px;
}

.search-box {
    margin-top: 18px;
    background: white;
    border-radius: 15px;
    padding: 13px 15px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.search-box input {
    border: none;
    outline: none;
    width: 100%;
    font-size: 15px;
}

/* CONTENT */

.content {
    padding: 18px 15px;
}

.section-title {
    font-size: 20px;
    margin-bottom: 13px;
}

/* CATEGORIES */

.categories {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 11px;
}

.category {
    background: white;
    padding: 18px 10px;
    border-radius: 16px;
    text-align: center;
    font-size: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
}

.category:active {
    transform: scale(.97);
}

.category-icon {
    display: block;
    font-size: 28px;
    margin-bottom: 7px;
}

/* BANNER */

.banner {
    margin-top: 20px;
    background: linear-gradient(
        135deg,
        #111827,
        #374151
    );

    color: white;
    border-radius: 18px;
    padding: 20px;
}

.banner h3 {
    font-size: 20px;
    margin-bottom: 7px;
}

.banner p {
    font-size: 13px;
    opacity: .85;
    margin-bottom: 15px;
}

/* BUTTON */

.main-btn {
    width: 100%;
    background: #7c3aed;
    color: white;
    padding: 14px;
    border-radius: 13px;
    font-size: 15px;
    font-weight: bold;
    margin-top: 12px;
}

.main-btn:active {
    transform: scale(.98);
}

/* MASTER CARD */

.master-card {
    background: white;
    border-radius: 17px;
    padding: 17px;
    margin-bottom: 12px;
    box-shadow: 0 2px 9px rgba(0,0,0,.05);
    transition: .15s;
}

.master-card:active {
    transform: scale(.98);
}

.master-card h3 {
    font-size: 18px;
    margin-bottom: 8px;
}

.master-card p {
    font-size: 14px;
    color: #6b7280;
    margin-top: 6px;
}

.master-price {
    color: #7c3aed !important;
    font-weight: bold;
}

/* EMPTY */

.empty {
    background: white;
    padding: 25px;
    text-align: center;
    border-radius: 16px;
    color: #6b7280;
}

/* PROFILE */

.profile-card {
    background: white;
    margin: 15px;
    padding: 22px;
    border-radius: 20px;
    text-align: center;
}

.avatar {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #ede9fe;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    margin: 0 auto 12px;
}

.profile-card h2 {
    margin-bottom: 5px;
}

.profile-card p {
    color: #6b7280;
    font-size: 14px;
}

/* FORM */

.form {
    padding: 16px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    font-size: 14px;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 12px;
    outline: none;
    background: white;
    font-family: inherit;
    font-size: 14px;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

/* MASTER PROFILE */

.master-profile {
    padding: 20px 15px;
    text-align: center;
}

.master-avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #ede9fe;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
    margin: 10px auto 15px;
}

.master-profile h2 {
    font-size: 24px;
    margin-bottom: 5px;
}

.master-category {
    color: #7c3aed;
    font-weight: bold;
}

.rating {
    margin-top: 10px;
    font-size: 15px;
}

.rating span {
    color: #6b7280;
    font-size: 13px;
}

.profile-info {
    background: white;
    border-radius: 18px;
    margin-top: 20px;
    padding: 5px 18px;
    text-align: left;
}

.profile-info div {
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.profile-info div:last-child {
    border-bottom: none;
}

.profile-info b {
    font-size: 14px;
}

.profile-info p {
    color: #6b7280;
    margin-top: 5px;
    font-size: 14px;
    line-height: 1.5;
}

/* BOTTOM NAV */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 68px;
    background: white;
    border-top: 1px solid #eee;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    z-index: 100;
}

.nav-btn {
    background: white;
    color: #777;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
}

.nav-btn span {
    font-size: 21px;
}

.nav-btn.active {
    color: #7c3aed;
    font-weight: bold;
}

.loading {
    text-align: center;
    padding: 25px;
    color: #777;
}

</style>
</head>

  <script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://qratbydofxbehieblqxz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_cvT_-P4fZf-aMwaGNfrU1A_jfqIiH7L";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   TELEGRAM
========================================= */

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();


const telegramUser =
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user
        ? tg.initDataUnsafe.user
        : null;


/* =========================================
   HTML XAVFSIZLIK
========================================= */

function escapeHtml(text) {

    if (
        text === null ||
        text === undefined
    ) {
        return "";
    }

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================
   SAHIFALAR
========================================= */

const pages = [
    "homePage",
    "categoryPage",
    "ordersPage",
    "profilePage",
    "menuPage",
    "masterPage"
];


function showPage(pageId) {

    pages.forEach(function(id) {

        const page =
            document.getElementById(id);

        if (page) {
            page.classList.add("hidden");
        }

    });


    const selected =
        document.getElementById(pageId);


    if (selected) {
        selected.classList.remove("hidden");
    }


    updateNavigation(pageId);
}


/* =========================================
   NAVIGATION
========================================= */

function updateNavigation(pageId) {

    document
        .querySelectorAll(".nav-btn")
        .forEach(function(btn) {

            btn.classList.remove("active");

        });


    if (pageId === "homePage") {

        document
            .getElementById("navHome")
            .classList.add("active");

    }


    if (pageId === "ordersPage") {

        document
            .getElementById("navOrders")
            .classList.add("active");

    }


    if (pageId === "profilePage") {

        document
            .getElementById("navProfile")
            .classList.add("active");

    }

}


/* =========================================
   BOSH SAHIFA
========================================= */

function goHome() {

    showPage("homePage");

    loadHomeMasters();

}


/* =========================================
   PROFIL
========================================= */

function showProfile() {

    showPage("profilePage");


    if (!telegramUser) {

        document
            .getElementById("profileName")
            .textContent =
                "Telegram orqali kiring";


        document
            .getElementById("profileUsername")
            .textContent = "";


        return;
    }


    const firstName =
        telegramUser.first_name || "";


    const lastName =
        telegramUser.last_name || "";


    const fullName =
        `${firstName} ${lastName}`.trim();


    document
        .getElementById("profileName")
        .textContent =
            fullName ||
            "Foydalanuvchi";


    document
        .getElementById("profileUsername")
        .textContent =
            telegramUser.username
                ? "@" +
                  telegramUser.username
                : "Telegram foydalanuvchisi";

}


/* =========================================
   USTA BO‘LISH
========================================= */

function openMasterRegistration() {

    showPage("menuPage");

}


/* =========================================
   USTA RO‘YXATDAN O‘TISH
========================================= */

async function registerMaster() {

    if (!telegramUser) {

        alert(
            "Iltimos, UstaTop'ni Telegram bot orqali oching."
        );

        return;
    }


    const name =
        document
            .getElementById("masterName")
            .value
            .trim();


    const category =
        document
            .getElementById("masterCategory")
            .value;


    const city =
        document
            .getElementById("masterCity")
            .value
            .trim();


    const description =
        document
            .getElementById("masterDescription")
            .value
            .trim();


    const price =
        Number(
            document
                .getElementById("masterPrice")
                .value
        ) || 0;


    if (!name) {

        alert(
            "Ismingizni kiriting."
        );

        return;
    }


    if (!city) {

        alert(
            "Shahringizni kiriting."
        );

        return;
    }


    try {

        const { error } =
            await supabaseClient
                .from("masters")
                .insert({

                    name: name,

                    category: category,

                    city: city,

                    description: description,

                    price_from: price,

                    rating: 0,

                    completed_orders: 0,

                    telegram_username:
                        telegramUser.username ||
                        null

                });


        if (error) {

            console.error(error);

            alert(
                "Xatolik: " +
                error.message
            );

            return;
        }


        alert(
            "✅ E'loningiz muvaffaqiyatli joylandi!"
        );


        document
            .getElementById("masterName")
            .value = "";


        document
            .getElementById("masterCity")
            .value = "";


        document
            .getElementById("masterDescription")
            .value = "";


        document
            .getElementById("masterPrice")
            .value = "";


        goHome();


    } catch (error) {

        console.error(error);

        alert(
            "Kutilmagan xatolik yuz berdi."
        );

    }

}


/* =========================================
   BOSH SAHIFADAGI USTALAR
========================================= */

async function loadHomeMasters() {

    const container =
        document.getElementById(
            "homeMasters"
        );


    container.innerHTML = `
        <div class="loading">
            Yuklanmoqda...
        </div>
    `;


    const { data, error } =
        await supabaseClient
            .from("masters")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            )
            .limit(20);


    if (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                ❌ Ustalarni yuklashda xatolik.
            </div>
        `;

        return;
    }


    renderMasters(
        data,
        container
    );

}


/* =========================================
   KATEGORIYA
========================================= */

async function openCategory(category) {

    showPage(
        "categoryPage"
    );


    document
        .getElementById("categoryTitle")
        .textContent =
            category;


    const container =
        document.getElementById(
            "categoryMasters"
        );


    container.innerHTML = `
        <div class="loading">
            Yuklanmoqda...
        </div>
    `;


    const { data, error } =
        await supabaseClient
            .from("masters")
            .select("*")
            .eq(
                "category",
                category
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                ❌ Ustalarni yuklashda xatolik.
            </div>
        `;

        return;
    }


    renderMasters(
        data,
        container
    );

}


/* =========================================
   USTA KARTOCHKALARI
========================================= */

function renderMasters(
    masters,
    container
) {

    container.innerHTML = "";


    if (
        !masters ||
        masters.length === 0
    ) {

        container.innerHTML = `
            <div class="empty">
                😔
                <br><br>
                Hozircha bu yerda ustalar yo‘q.
            </div>
        `;

        return;
    }


    masters.forEach(
        function(master) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "master-card";


            card.style.cursor =
                "pointer";


            /*
             * ENG MUHIM QISM:
             * E'LONNI BOSGANDA
             * O‘SHA USTANING PROFILI OCHILADI
             */

            card.onclick =
                function() {

                    openMasterProfile(
                        master.id
                    );

                };


            const price =
                master.price_from &&
                Number(
                    master.price_from
                ) > 0

                ? Number(
                    master.price_from
                  ).toLocaleString(
                    "uz-UZ"
                  ) + " so‘mdan"

                : "Kelishiladi";


            card.innerHTML = `

                <h3>
                    ${escapeHtml(
                        master.name
                    )}
                </h3>


                <p>
                    🔧
                    ${escapeHtml(
                        master.category
                    )}
                </p>


                <p>
                    📍
                    ${escapeHtml(
                        master.city
                    )}
                </p>


                <p>
                    ⭐
                    ${master.rating || 0}

                    ·

                    ${master.completed_orders || 0}
                    ta buyurtma
                </p>


                <p class="master-price">
                    💰 ${price}
                </p>


                <p style="
                    color:#7c3aed;
                    font-weight:bold;
                    margin-top:12px;
                ">
                    Profilni ko‘rish →
                </p>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================
   USTA PROFILI
========================================= */

async function openMasterProfile(
    masterId
) {

    showPage(

    const page =
        document.getElementById(

        );


    page.innerHTML = `

            <button
                class="back-btn"
                onclick="goHome()"
            >

            </button>

            <h2>
                Usta profili
            </h2>

        </div>


        <div class="loading">
            Yuklanmoqda...
        </div>

    `;


    const {
        data: master,
        error
    } =
        await supabaseClient
            .from("masters")
            .select("*")
            .eq(

                masterId

            .single();


    if (

        page.innerHTML = `

                    ❌

                    <br><br>

                    Usta topilmadi.

                </div>

        `;


        return;
    }


    const price =
        master.price_from &&
        Number(
            master.price_from
        ) > 0

        ? Number(
            master.price_from
          ).toLocaleString(
            "uz-UZ"
          ) + " so‘mdan"

        : "Kelishiladi";


    let contactButton = "";


    if (
        master.telegram_username
    ) {

        const username =
            String(
                master.telegram_username
            ).replace(
                "@",
                ""
            );


        contactButton = `

            <button
                class="main-btn"
                onclick="contactMaster('${escapeHtml(
                    username
                )}')"
            >
                💬 Usta bilan bog‘lanish
            </button>

        `;

    } else {

        contactButton = `

            <button
                class="main-btn"
                onclick="alert('Ustaning Telegram username ma’lumoti mavjud emas.')"
            >
                💬 Bog‘lanish
            </button>

        `;

    }


    page.innerHTML = `

        <div class="topbar">

            <button
                class="back-btn"
                onclick="goHome()"
            >
                ←
            </button>

            <h2>
                Usta profili
            </h2>

        </div>


        <div class="master-profile">


            <div class="master-avatar">
                👨‍🔧
            </div>


            <h2>
                ${escapeHtml(
                    master.name
                )}
            </h2>


            <p class="master-category">

                ${escapeHtml(
                    master.category
                )}

            </p>


            <div class="rating">

                ⭐
                ${master.rating || 0}

                <span>

                    ·
                    ${master.completed_orders || 0}
                    ta buyurtma

                </span>

            </div>


            <div class="profile-info">


                <div>

                    <b>
                        📍 Shahar
                    </b>

                    <p>

                        ${escapeHtml(
                            master.city ||
                            "Ko‘rsatilmagan"
                        )}

                    </p>

                </div>


                <div>

                    <b>
                        💰 Xizmat narxi
                    </b>

                    <p>
                        ${price}
                    </p>

                </div>


                <div>

                    <b>
                        📝 Usta haqida
                    </b>

                    <p>

                        ${escapeHtml(
                            master.description ||
                            "Ma’lumot kiritilmagan."
                        )}

                    </p>

                </div>


                <div>

                    <b>
                        ⭐ Reyting
                    </b>

                    <p>
                        ${master.rating || 0} / 5
                    </p>

                </div>


                <div>

                    <b>
                        📋 Bajarilgan buyurtmalar
                    </b>

                    <p>

                        ${master.completed_orders || 0}
                        ta

                    </p>

                </div>


            </div>


            ${contactButton}


        </div>

    `;

}


/* =========================================
   USTA BILAN BOG‘LANISH
========================================= */

function contactMaster(
    username
) {

    if (!username) {

        alert(
            "Ustaning Telegram username ma’lumoti mavjud emas."
        );

        return;
    }


    const cleanUsername =
        String(
            username
        ).replace(
            "@",
            ""
        );


    window.open(
        "https://t.me/" +
        cleanUsername,
        "_blank"
    );

}


/* =========================================
   QIDIRUV
========================================= */

let searchTimer = null;


function searchMasters() {

    clearTimeout(
        searchTimer
    );


    searchTimer =
        setTimeout(
            performSearch,
            350
        );

}


async function performSearch() {

    const input =
        document.getElementById(
            "searchInput"
        );


    const query =
        input.value.trim();


    if (!query) {

        loadHomeMasters();

        return;
    }


    const container =
        document.getElementById(
            "homeMasters"
        );


    container.innerHTML = `

        <div class="loading">
            Qidirilmoqda...
        </div>

    `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("masters")
            .select("*")
            .or(
                `name.ilike.%${query}%,category.ilike.%${query}%,city.ilike.%${query}%`
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);


        container.innerHTML = `

            <div class="empty">

                ❌

                <br><br>

                Qidirishda xatolik yuz berdi.

            </div>

        `;


        return;
    }


    renderMasters(
        data,
        container
    );

}

);
